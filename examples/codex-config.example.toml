# Example: a Codex CLI config (~/.codex/config.toml) with a Blender MCP server,
# BEFORE wrapping. Run `mcp-tripwire install --host codex --server blender` to
# see the wrapped form, and `--write` to apply it (a backup is taken first).

model = "gpt-5-codex"

[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp"]

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/me/data"]

# AFTER wrapping, the blender entry becomes:
#
# [mcp_servers.blender]
# command = "/path/to/node"
# args = ["/path/to/mcp-tripwire/src/cli.js", "wrap", "--name", "blender",
#         "--state", "/Users/me/.mcp-tripwire/state.json",
#         "--log", "/Users/me/.mcp-tripwire/audit.jsonl",
#         "--", "uvx", "blender-mcp"]

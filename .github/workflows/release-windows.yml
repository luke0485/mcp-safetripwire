name: Windows release
on:
  push:
    tags: ['initial', 'preview-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build executable
        shell: pwsh
        run: ./tools/build.ps1 -SkipInstall
      - name: Smoke test and package
        shell: pwsh
        run: |
          ./dist/tripwire.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed.' }
          ./tools/package-release.ps1
          ./tools/package-source.ps1
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/tripwire.exe
            dist/MCP-Tripwire-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/tripwire.exe
            dist/MCP-Tripwire-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/MCP-Tripwire-source.zip
      - name: Publish initial preview
        if: github.ref == 'refs/tags/initial'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create initial --verify-tag --title "初版 / Initial preview" --prerelease --notes-file docs/INITIAL-RELEASE.md dist/tripwire.exe dist/MCP-Tripwire-windows-x64.zip dist/MCP-Tripwire-source.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Initial release publication failed.' }
      - name: Prepare later draft release
        if: startsWith(github.ref, 'refs/tags/preview-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "Windows 预览版 / Windows preview" --draft --generate-notes dist/tripwire.exe dist/MCP-Tripwire-windows-x64.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

name: Windows release
on:
  push:
    tags: ['windows']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build executable
        shell: pwsh
        run: ./tools/build.ps1 -SkipInstall
      - name: Smoke test and package
        shell: pwsh
        run: |
          ./dist/safetripwire.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed.' }
          ./tools/package-release.ps1
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/safetripwire.exe
            dist/MCP-SafeTripwire-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/safetripwire.exe
            dist/MCP-SafeTripwire-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows --clobber dist/safetripwire.exe dist/MCP-SafeTripwire-windows-x64.zip dist/SHA256SUMS.txt
          } else {
            gh release create windows --target "$env:GITHUB_SHA" --title "Windows 下载 / Windows download" --latest --notes-file docs/WINDOWS-DOWNLOAD.md dist/safetripwire.exe dist/MCP-SafeTripwire-windows-x64.zip dist/SHA256SUMS.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows download publication failed.' }

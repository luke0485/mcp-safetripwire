name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build executable
        shell: pwsh
        run: ./tools/build.ps1 -SkipInstall
      - name: Smoke test and package
        shell: pwsh
        run: |
          ./dist/tripwire.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed.' }
          ./tools/package-release.ps1
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/tripwire.exe
            dist/MCP-Tripwire-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/tripwire.exe
            dist/MCP-Tripwire-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --generate-notes dist/tripwire.exe dist/MCP-Tripwire-windows-x64.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
